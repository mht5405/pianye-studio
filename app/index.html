<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const theme = localStorage.getItem("md2card-ui-theme");
        document.documentElement.dataset.uiTheme = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      } catch {}
    </script>
    <meta
      name="description"
      content="篇页 Markdown 图文工作室：选择封面、预览分页并下载 PNG ZIP。"
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <title>篇页 · 图文工作室</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="../src/main.tsx"></script>
  </body>
</html>
